[package]
name = "tokenizer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GPT-2 style byte-level BPE tokenizer built from GGUF metadata."

[dependencies]
gguf = { path = "../gguf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HF chat templates are Jinja; minijinja covers the subset instruct models need.
# pycompat adds Python str methods (.format, .strip, …) that HF templates use.
minijinja = { version = "2", features = ["json"] }
minijinja-contrib = { version = "2", default-features = false, features = ["pycompat"] }
# Sync HTTP for tokenizer_config.json + llama.cpp catalog fetches.
ureq = { version = "2", default-features = true, features = ["tls"] }

[[bin]]
name = "get-chat-template"
path = "src/bin/get_chat_template.rs"
