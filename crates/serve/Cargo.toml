[package]
name = "serve"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OpenAI-compatible HTTP server over the pulsar engine."

[dependencies]
engine = { path = "../engine" }
gguf = { path = "../gguf" }
tokenizer = { path = "../tokenizer" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# SIGINT handling for the shutdown warm-census save. Kept tiny on purpose:
# it only flips an atomic flag; the accept loop does the actual work.
ctrlc = "3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time", "io-util"] }
# MCP client (gated behind --webui-mcp-proxy). streamable-http covers both
# http and sse endpoints since rmcp 0.11 removed the standalone sse transport.
rmcp = { version = "3", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

[[bin]]
name = "pulsar-serve"
path = "src/main.rs"
